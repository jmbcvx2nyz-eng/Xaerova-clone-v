    :root {
      --blue: #078cff;
      --cyan: #00c8ff;
      --background-opacity: .38;
    }

    * { box-sizing: border-box; }

    html { background: #01060b; }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      isolation: isolate;
      color: #f2faff;
      background: #01060b;
      font-family: "XAerova Text", Arial, sans-serif;
    }

    #earth-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #01060b;
      contain: strict;
      opacity: var(--background-opacity);
    }

    #xaerova-earth {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      height: 62px;
      width: 100%;
      padding: 0 clamp(18px, 4vw, 58px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      background: rgba(0,0,0,.88);
      border-bottom: 1px solid rgba(255,255,255,.12);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      width: fit-content;
    }

    .brand img {
      width: 112px;
      height: auto;
      max-height: 34px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vw, 44px);
      white-space: nowrap;
      font-family: "XAerova Display", sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .32em;
      color: rgba(255,255,255,.8);
    }

    .nav-links a { transition: color .2s ease; }

    .nav-links a:hover,
    .dropdown-trigger:hover { color: var(--cyan); }

    .dropdown { position: relative; }

    .dropdown-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
      letter-spacing: inherit;
    }

    .dropdown-arrow {
      font-size: 13px;
      transition: transform .2s ease;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 220px;
      padding: 8px;
      background: rgba(2, 12, 25, .97);
      border: 1px solid rgba(0, 150, 255, .42);
      border-radius: 5px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      z-index: 20;
      letter-spacing: .08em;
      white-space: normal;
    }

    .dropdown-menu a {
      display: block;
      padding: 12px 13px;
      color: rgba(255,255,255,.9);
      font: 600 12px "XAerova Text", sans-serif;
      letter-spacing: .08em;
    }

    .dropdown-menu a:hover {
      color: var(--cyan);
      background: rgba(0,140,255,.14);
    }

    .dropdown.open .dropdown-menu { display: block; }

    .dropdown.open .dropdown-arrow { transform: rotate(180deg); }

    .right-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .language-switch {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 3px;
      overflow: hidden;
    }

    .language-switch button {
      border: 0;
      min-width: 42px;
      padding: 8px 10px;
      color: rgba(255,255,255,.72);
      background: transparent;
      cursor: pointer;
      font: 700 9px "XAerova Text", sans-serif;
      letter-spacing: .12em;
    }

    .language-switch button.active {
      color: white;
      background: var(--blue);
    }

    .mobile-menu-toggle { display: none; }

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      .topbar {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: nowrap;
        height: 64px;
        min-height: 64px;
        padding: 0 15px;
        gap: 12px;
      }

      .brand {
        flex: 0 0 auto;
        margin-right: 4px;
      }

      .brand img {
        width: 96px;
        max-height: 32px;
      }

      .mobile-menu-toggle {
        display: flex;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        padding: 9px 7px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(0,153,255,.45);
        border-radius: 5px;
        background: rgba(0,100,180,.12);
        cursor: pointer;
      }

      .mobile-menu-toggle span {
        display: block;
        width: 21px;
        height: 2px;
        border-radius: 2px;
        background: #fff;
        transition: transform .2s ease, opacity .2s ease;
      }

      .mobile-menu-toggle.active span:first-child {
        transform: translateY(7px) rotate(45deg);
      }

      .mobile-menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .mobile-menu-toggle.active span:last-child {
        transform: translateY(-7px) rotate(-45deg);
      }

      .right-tools {
        flex: 0 0 auto;
        margin-left: auto;
      }

      .language-switch button {
        min-width: 38px;
        padding: 9px 8px;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        width: 100%;
        padding: 18px 15px;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0;
        background: rgba(2,10,22,.98);
        border-bottom: 1px solid rgba(0,153,255,.35);
        box-shadow: 0 12px 25px rgba(0,0,0,.4);
        font-size: 10px;
        letter-spacing: .18em;
      }

      .nav-links.mobile-open { display: flex; }

      .nav-links > a,
      .nav-links .dropdown-trigger {
        display: flex;
        width: 100%;
        padding: 15px 10px;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }

      .dropdown { width: 100%; }

      .dropdown-menu {
        position: static;
        width: 100%;
        min-width: 0;
        transform: none;
        margin: 0;
        padding: 5px 10px;
        border: 0;
        border-radius: 0;
        background: rgba(0,100,180,.12);
        box-shadow: none;
      }
    }

    @media (max-width: 340px) {
      .brand img { width: 82px; }

      .topbar {
        padding: 0 10px;
        gap: 8px;
      }
    }

    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 18vh 24px 40px;
      text-align: center;
    }

    h1 {
      max-width: 100%;
      margin: 0;
      font-family: "XAerova Display", "Arial Black", Arial, sans-serif;
      font-size: clamp(29px, 6.4vw, 88px);
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: .075em;
      text-indent: .075em;
      text-wrap: balance;
      text-shadow: 0 3px 28px #0009, 0 0 36px #4dbaff22;
    }

    .coming-soon {
      margin: 22px 0 0;
      color: #d9eaf3;
      font-size: clamp(14px, 1.55vw, 21px);
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: .48em;
      text-indent: .48em;
    }

    .availability {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 24px 0 0;
      color: #9ec5d2;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      letter-spacing: .28em;
    }

    .availability::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b7f0ff;
      box-shadow: 0 0 10px #53d9ff99;
      animation: signal-breathe 3.8s ease-in-out infinite;
    }

    @keyframes signal-breathe {
      0%, 100% {
        opacity: .4;
        box-shadow: 0 0 4px #53d9ff44;
      }
      50% {
        opacity: 1;
        box-shadow: 0 0 13px #53d9ffbb;
      }
    }

    @media (max-width: 600px) {
      .hero { padding: 18vh 18px 30px; }

      h1 {
        font-size: clamp(26px, 7.5vw, 44px);
        letter-spacing: .035em;
        text-indent: .035em;
      }

      .coming-soon {
        margin-top: 18px;
        font-size: 14px;
        letter-spacing: .38em;
        text-indent: .38em;
      }

      .availability {
        margin-top: 20px;
        font-size: 13px;
      }
    }

    @media (max-height: 500px) and (min-width: 600px) {
      .hero { padding-top: 8vh; }
      h1 { font-size: 42px; }

      .coming-soon {
        margin-top: 13px;
        font-size: 14px;
      }

      .availability {
        margin-top: 12px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .availability::before { animation: none; }
    }
  </style>

    (() => {

    /*
     * Procedural orbital scene:
     * moving Earth, drifting clouds, shining cities and twinkling stars.
     * No background images, textures, external libraries or video files.
     */
    (() => {
      "use strict";

      const run = () => {
        const root = document.getElementById("earth-background");
        const canvas = document.getElementById("xaerova-earth");
        if (!root || !canvas) return;

        const ctx = canvas.getContext("2d", { alpha: false });
        if (!ctx) return;

        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        const TAU = Math.PI * 2;
        const MW = 2048;
        const MH = 1024;
        const NW = 512;
        const NH = 256;

        const clamp = (v, a = 0, b = 1) =>
          Math.max(a, Math.min(b, v));

        const fract = v => v - Math.floor(v);

        const ease = (a, b, v) => {
          v = clamp((v - a) / (b - a));
          return v * v * (3 - 2 * v);
        };

        let seed = 71927;

        const random = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };

        const make = (w, h) => {
          const c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          return c;
        };

        const grid = (w, h) => {
          const values = new Float32Array(w * h);

          for (let i = 0; i < values.length; i++) {
            values[i] = random();
          }

          return (u, v) => {
            const x = fract(u) * w;
            const y = fract(v) * h;
            const xi = Math.floor(x);
            const yi = Math.floor(y);
            const fx = x - xi;
            const fy = y - yi;
            const sx = fx * fx * (3 - 2 * fx);
            const sy = fy * fy * (3 - 2 * fy);

            const a = values[yi * w + xi];
            const b = values[yi * w + (xi + 1) % w];
            const c = values[((yi + 1) % h) * w + xi];
            const d = values[((yi + 1) % h) * w + (xi + 1) % w];

            return (a + (b - a) * sx) * (1 - sy) +
              (c + (d - c) * sx) * sy;
          };
        };

        const continents = [
          grid(4, 3),
          grid(9, 7),
          grid(23, 17)
        ];

        const weather = [
          grid(5, 9),
          grid(13, 21),
          grid(29, 43),
          grid(61, 83),
          grid(127, 137)
        ];

        const terrain = new Uint8Array(NW * NH);
        const clouds = new Uint8Array(NW * NH);

        for (let y = 0; y < NH; y++) {
          const v = y / NH;

          for (let x = 0; x < NW; x++) {
            const u = x / NW;
            const i = y * NW + x;

            const n =
              continents[0](u, v) * .60 +
              continents[1](u, v) * .28 +
              continents[2](u, v) * .12;

            terrain[i] = ease(.39, .61, n) * 255;

            const bend = weather[0](u, v);

            const w =
              weather[0](u, v) * .32 +
              weather[1](u + bend * .09, v) * .30 +
              weather[2](u + bend * .06, v) * .21 +
              weather[3](u, v) * .12 +
              weather[4](u, v) * .05;

            clouds[i] = Math.pow(ease(.39, .68, w), 1.15) * 255;
          }
        }

        const landAt = (x, y) =>
          terrain[
            ((Math.floor(y / MH * NH) + NH) % NH) * NW +
            ((Math.floor(x / MW * NW) + NW) % NW)
          ] / 255;

        const city = make(MW, MH);
        const cityCtx = city.getContext("2d", {
          willReadFrequently: true
        });

        cityCtx.fillStyle = "#000";
        cityCtx.fillRect(0, 0, MW, MH);

        const hubs = [];

        for (
          let attempts = 0;
          attempts < 18000 && hubs.length < 1100;
          attempts++
        ) {
          const x = random() * MW;
          const y = random() * MH;

          if (
            landAt(x, y) < .56 ||
            continents[1](x / MW, y / MH) < .43 ||
            random() > .40 + .45 * continents[1](x / MW, y / MH)
          ) {
            continue;
          }

          const radius = 2.5 + Math.pow(random(), 2) * 14;
          hubs.push({ x, y, radius });

          const branches = 4 + Math.floor(random() * 8);

          for (let branch = 0; branch < branches; branch++) {
            let angle = random() * TAU;
            let px = x;
            let py = y;
            const steps = 5 + Math.floor(random() * 25);

            for (let step = 0; step < steps; step++) {
              const distance = .55 + random() * radius * .20;
              angle += (random() - .5) * .55;

              const nx = px + Math.cos(angle) * distance;
              const ny = py + Math.sin(angle) * distance;

              if (landAt(nx, ny) < .29) break;

              cityCtx.strokeStyle =
                "rgba(255,255,255," + (.003 + random() * .018) + ")";
              cityCtx.lineWidth = .35 + random() * .4;
              cityCtx.beginPath();
              cityCtx.moveTo(px, py);
              cityCtx.lineTo(nx, ny);
              cityCtx.stroke();

              if (random() > .30) {
                const alpha = .15 + Math.pow(random(), 2) * .83;

                cityCtx.fillStyle =
                  "rgba(255,255,255," + alpha + ")";

                const dot = .28 + random() * .52;
                cityCtx.fillRect(nx, ny, dot, dot);

                if (random() > .62) {
                  cityCtx.fillStyle =
                    "rgba(255,255,255," + alpha * .52 + ")";

                  cityCtx.fillRect(
                    nx + (random() - .5) * 3,
                    ny + (random() - .5) * 3,
                    .6,
                    .6
                  );
                }
              }

              px = nx;
              py = ny;
            }
          }

          for (let k = 0; k < 35; k++) {
            const angle = random() * TAU;
            const r = Math.pow(random(), 1.8) * radius;

            cityCtx.fillStyle =
              "rgba(255,255,255," + (.18 + random() * .74) + ")";

            cityCtx.fillRect(
              x + Math.cos(angle) * r,
              y + Math.sin(angle) * r * .65,
              .4 + random() * .7,
              .4 + random() * .6
            );
          }
        }

        // Faint routes between nearby settlements.
        cityCtx.lineWidth = .45;

        for (let i = 0; i < hubs.length; i++) {
          const a = hubs[i];
          let nearest = null;
          let distance = 58 * 58;

          for (
            let j = i + 1;
            j < Math.min(hubs.length, i + 90);
            j++
          ) {
            const b = hubs[j];
            const d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

            if (
              d < distance &&
              d > 9 * 9 &&
              landAt((a.x + b.x) / 2, (a.y + b.y) / 2) > .35
            ) {
              nearest = b;
              distance = d;
            }
          }

          if (!nearest) continue;

          cityCtx.strokeStyle = "rgba(255,255,255,.018)";
          cityCtx.beginPath();
          cityCtx.moveTo(a.x, a.y);
          cityCtx.quadraticCurveTo(
            (a.x + nearest.x) / 2 + 5,
            (a.y + nearest.y) / 2 - 4,
            nearest.x,
            nearest.y
          );
          cityCtx.stroke();
        }

        const glow = make(MW, MH);
        const glowCtx = glow.getContext("2d", {
          willReadFrequently: true
        });

        glowCtx.fillStyle = "#000";
        glowCtx.fillRect(0, 0, MW, MH);
        glowCtx.filter = "blur(2.2px)";
        glowCtx.drawImage(city, 0, 0);
        glowCtx.filter = "none";

        const cityPixels = cityCtx.getImageData(0, 0, MW, MH).data;
        const glowPixels = glowCtx.getImageData(0, 0, MW, MH).data;
        const lights = new Uint8Array(MW * MH);
        const bloom = new Uint8Array(MW * MH);

        for (let i = 0; i < lights.length; i++) {
          lights[i] = cityPixels[i * 4];
          bloom[i] = glowPixels[i * 4];
        }

        const sky = make(1, 1);
        const skyCtx = sky.getContext("2d");
        const atmosphere = make(1, 1);
        const atmosphereCtx = atmosphere.getContext("2d");
        const surface = make(1, 1);
        const surfaceCtx = surface.getContext("2d");

        const cityPulseX = new Float32Array(MW);
        const cityPulseY = new Float32Array(MH);

        const starSprite = make(32, 32);
        const starCtx = starSprite.getContext("2d");
        const starLight = starCtx.createRadialGradient(
          16, 16, 0, 16, 16, 16
        );

        starLight.addColorStop(0, "rgba(228,251,255,1)");
        starLight.addColorStop(.12, "rgba(177,230,255,.85)");
        starLight.addColorStop(.32, "rgba(113,199,245,.18)");
        starLight.addColorStop(1, "rgba(74,176,238,0)");
        starCtx.fillStyle = starLight;
        starCtx.fillRect(0, 0, 32, 32);

        let shiningStars = [];
        let width;
        let height;
        let top;
        let pixels;
        let map;
        let count = 0;
        let horizon = [];
        let raf = 0;
        let last = 0;
        let elapsed = 0;
        let frames = 0;
        let dead = false;
        let resizeFrame = 0;
        let ready = false;

        function rim(context, strength) {
          const scale = width / 1365;
          const gradient = context.createLinearGradient(
            0, 0, width, 0
          );

          gradient.addColorStop(
            0, "rgba(8,143,181," + strength * .32 + ")"
          );
          gradient.addColorStop(
            .25, "rgba(61,201,248," + strength * .69 + ")"
          );
          gradient.addColorStop(
            .60, "rgba(203,255,255," + strength + ")"
          );
          gradient.addColorStop(
            .83, "rgba(135,242,255," + strength * .92 + ")"
          );
          gradient.addColorStop(
            1, "rgba(62,209,237," + strength * .64 + ")"
          );

          context.strokeStyle = gradient;

          const layers = [
            [76, 25, .28],
            [30, 12, .60],
            [12, 4, .86],
            [5.2, 1.0, 1]
          ];

          for (const layer of layers) {
            context.globalAlpha = layer[2];
            context.lineWidth = Math.max(1, layer[0] * scale);
            context.filter =
              "blur(" + Math.max(.3, layer[1] * scale) + "px)";
            context.beginPath();

            for (let i = 0; i < horizon.length; i++) {
              const p = horizon[i];
              if (!i) context.moveTo(p[0], p[1]);
              else context.lineTo(p[0], p[1]);
            }

            context.stroke();
          }

          context.filter = "none";
          context.globalAlpha = 1;
        }

        function resize() {
          if (dead) return;

          const w = Math.max(1, innerWidth);
          const h = Math.max(1, innerHeight);

          const ratio = Math.min(
            devicePixelRatio || 1,
            1.15,
            (w <= 760 ? 550 : 900) / w
          );

          width = canvas.width = sky.width =
            atmosphere.width = Math.round(w * ratio);

          height = canvas.height = sky.height =
            atmosphere.height = Math.round(h * ratio);

          const camera = 1.035;
          const pitch = .29;
          const cp = Math.cos(pitch);
          const sp = Math.sin(pitch);
          const tanH = Math.tan(Math.PI * 70 / 360);
          const tanV = tanH * height / width;
          const q = Math.sqrt(camera * camera - 1) / camera;

          horizon = [];

          for (let x = 0; x <= width + 8; x += 8) {
            const sx = (x / width - .5) * 2 * tanH;
            const A = cp * cp - q * q;
            const B = -2 * sp * cp;
            const C = sp * sp - q * q * (1 + sx * sx);
            const sy =
              (-B - Math.sqrt(B * B - 4 * A * C)) / (2 * A);

            horizon.push([
              x,
              (.5 - sy / (2 * tanV)) * height
            ]);
          }

          top = Math.max(
            0,
            Math.floor(Math.min(...horizon.map(p => p[1]))) - 2
          );

          surface.width = width;
          surface.height = height - top;
          pixels = surfaceCtx.createImageData(width, height - top);

          const capacity = width * (height - top);

          map = {
            index: new Uint32Array(capacity),
            u: new Float32Array(capacity),
            cityRow: new Uint32Array(capacity),
            smallRow: new Uint32Array(capacity),
            cityFy: new Float32Array(capacity),
            smallFy: new Float32Array(capacity),
            fog: new Float32Array(capacity),
            shade: new Float32Array(capacity)
          };

          count = 0;

          for (let y = top; y < height; y++) {
            const sy = (.5 - (y + .5) / height) * 2 * tanV;

            for (let x = 0; x < width; x++) {
              const sx = ((x + .5) / width - .5) * 2 * tanH;
              const length = Math.sqrt(1 + sx * sx + sy * sy);
              const dx = sx / length;
              const dy = (cp + sy * sp) / length;
              const dz = (-sp + sy * cp) / length;
              const b = camera * dz;
              const discriminant =
                b * b - (camera * camera - 1);

              if (discriminant <= 0 || dz >= 0) continue;

              const distance = -b - Math.sqrt(discriminant);
              const px = distance * dx;
              const py = distance * dy;
              const pz = camera + distance * dz;
              const north = .9 * py - .435889894 * pz;
              const depth = .435889894 * py + .9 * pz;
              const incidence = -(px * dx + py * dy + pz * dz);
              const i = count++;
              const offset = ((y - top) * width + x) * 4;

              map.index[i] = offset;

              map.u[i] =
                fract(.52 + Math.atan2(px, depth) / TAU * 14) * MW;

              const v = fract(
                .15 +
                (.5 - Math.asin(clamp(north, -1, 1)) / Math.PI) * 6
              );

              const cityY = v * MH;
              const smallY = v * NH;

              map.cityRow[i] = (cityY | 0) * MW;
              map.cityFy[i] = cityY - (cityY | 0);
              map.smallRow[i] = (smallY | 0) * NW;
              map.smallFy[i] = smallY - (smallY | 0);
              map.fog[i] = Math.exp(-incidence * 23);
              map.shade[i] =
                .70 + .30 * clamp((y - top) / (height - top));

              pixels.data[offset + 3] = 255;
            }
          }

          skyCtx.fillStyle = "#01050a";
          skyCtx.fillRect(0, 0, width, height);
          skyCtx.save();
          skyCtx.scale(1, .85);

          const skyGlow = skyCtx.createRadialGradient(
            width * .64,
            height * .46 / .85,
            0,
            width * .64,
            height * .46 / .85,
            width * .78
          );

          skyGlow.addColorStop(0, "rgba(0,174,193,.32)");
          skyGlow.addColorStop(.35, "rgba(0,96,122,.17)");
          skyGlow.addColorStop(1, "rgba(0,18,33,0)");

          skyCtx.fillStyle = skyGlow;
          skyCtx.fillRect(0, 0, width, height / .85);
          skyCtx.restore();

          shiningStars = [];
          let starSeed = 1781;

          const starRandom = () => {
            starSeed = starSeed * 16807 % 2147483647;
            return (starSeed - 1) / 2147483646;
          };

          for (
            let i = 0;
            i < Math.min(230, width * height / 5100);
            i++
          ) {
            const x = starRandom() * width;
            const y = starRandom() * height * .60;
            const r = .25 + starRandom() * .65;

            skyCtx.fillStyle =
              "rgba(153,213,228," + (.12 + starRandom() * .44) + ")";

            skyCtx.beginPath();
            skyCtx.arc(x, y, r, 0, TAU);
            skyCtx.fill();

            if (i % 9 === 2 && y < height * .44) {
              shiningStars.push({
                x,
                y,
                size: 5 + r * 5,
                phase: i * 1.71,
                speed: .68 + (i % 5) * .11
              });
            }
          }

          rim(atmosphereCtx, .86);
          render();
        }

        function render() {
          if (!pixels || dead) return;

          const output = pixels.data;
          const orbit = fract(elapsed * .00165) * MW;
          const wind = fract(.12 + elapsed * .00065) * NW;
          const lightPhase = elapsed * 1.02;

          for (let x = 0; x < MW; x++) {
            cityPulseX[x] =
              .5 + .5 * Math.sin(lightPhase + x * .061);
          }

          for (let y = 0; y < MH; y++) {
            cityPulseY[y] =
              .5 + .5 * Math.sin(elapsed * .74 + y * .077 + 2.3);
          }

          for (let i = 0; i < count; i++) {
            const x = map.u[i] + orbit;
            const floorX = x | 0;
            const fx = x - floorX;
            const x0 = floorX & (MW - 1);
            const x1 = (x0 + 1) & (MW - 1);

            const row = map.cityRow[i];
            const next = (row + MW) & (MW * MH - 1);
            const fy = map.cityFy[i];

            const a = row + x0;
            const b = row + x1;
            const c = next + x0;
            const d = next + x1;

            const wa = (1 - fx) * (1 - fy);
            const wb = fx * (1 - fy);
            const wc = (1 - fx) * fy;
            const wd = fx * fy;

            const lightValue =
              lights[a] * wa +
              lights[b] * wb +
              lights[c] * wc +
              lights[d] * wd;

            const glowValue =
              bloom[a] * wa +
              bloom[b] * wb +
              bloom[c] * wc +
              bloom[d] * wd;

            const smallX = x * .25;
            const floorSmall = smallX | 0;
            const f = smallX - floorSmall;
            const sx = floorSmall & (NW - 1);
            const sx1 = (sx + 1) & (NW - 1);

            const sr = map.smallRow[i];
            const sn = (sr + NW) & (NW * NH - 1);
            const sf = map.smallFy[i];

            const land = (
              (terrain[sr + sx] * (1 - f) +
                terrain[sr + sx1] * f) * (1 - sf) +
              (terrain[sn + sx] * (1 - f) +
                terrain[sn + sx1] * f) * sf
            ) / 255;

            const cloudX = smallX + wind;
            const floorCloud = cloudX | 0;
            const cf = cloudX - floorCloud;
            const cx = floorCloud & (NW - 1);
            const cx1 = (cx + 1) & (NW - 1);

            const cover = (
              (clouds[sr + cx] * (1 - cf) +
                clouds[sr + cx1] * cf) * (1 - sf) +
              (clouds[sn + cx] * (1 - cf) +
                clouds[sn + cx1] * cf) * sf
            ) / 255;

            const target = map.index[i];
            const fog = map.fog[i];
            const transmission = 1 - cover * .93;

            const shine =
              .57 +
              cityPulseX[x0] ** 2 * .66 +
              cityPulseY[row / MW] ** 2 * .37;

            const city =
              lightValue *
              transmission *
              (1 - fog * .94) *
              .93 *
              shine;

            const glow =
              glowValue *
              transmission *
              .95 *
              (1 - fog * .8) *
              (.72 + shine * .43);

            const white = Math.max(0, city - 36) * .42;
            const cloudLight = cover * (47 + fog * 25);
            const shade = map.shade[i] * .60;

            output[target] =
              (2 + land * 3) * shade +
              city * 1.12 +
              glow * .80 +
              cloudLight * .66 +
              fog * 1.8;

            output[target + 1] =
              (7 + land * 5) * shade +
              city * .87 +
              glow * .57 +
              white +
              cloudLight * .82 +
              fog * 15;

            output[target + 2] =
              (13 + land * 6) * shade +
              city * .66 +
              glow * .43 +
              white +
              cloudLight +
              fog * 26;
          }

          surfaceCtx.putImageData(pixels, 0, 0);
          ctx.drawImage(sky, 0, 0);

          for (const star of shiningStars) {
            ctx.globalAlpha =
              .20 +
              .36 * (.5 + .5 * Math.sin(
                elapsed * star.speed + star.phase
              ));

            ctx.drawImage(
              starSprite,
              star.x - star.size / 2,
              star.y - star.size / 2,
              star.size,
              star.size
            );
          }

          ctx.globalAlpha = 1;
          ctx.drawImage(surface, 0, top);

          ctx.globalAlpha = .84 + Math.sin(elapsed * .95) * .018;
          ctx.drawImage(atmosphere, 0, 0);
          ctx.globalAlpha = 1;

          frames++;
          root.dataset.proceduralFrame = String(frames);
          root.dataset.proceduralTime = elapsed.toFixed(2);
          root.dataset.proceduralOrbit = (orbit / MW).toFixed(5);
          root.dataset.proceduralLightPhase =
            (lightPhase % TAU).toFixed(3);
        }

        function stop() {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          last = 0;
        }

        function start() {
          if (
            !dead &&
            ready &&
            !raf &&
            !document.hidden &&
            !motion.matches
          ) {
            raf = requestAnimationFrame(tick);
          }
        }

        function tick(now) {
          raf = 0;

          if (dead || document.hidden || motion.matches) {
            last = 0;
            return;
          }

          if (!last) last = now;

          const delta = now - last;
          const frameInterval =
            innerWidth <= 760 ? 1000 / 16 : 1000 / 20;

          if (delta >= frameInterval) {
            elapsed += Math.min(delta / 1000, .25);
            last = now;
            render();
          }

          start();
        }

        addEventListener("resize", () => {
          cancelAnimationFrame(resizeFrame);
          resizeFrame = requestAnimationFrame(resize);
        }, { passive: true });

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else start();
        });

        const motionChange = () => {
          stop();
          render();
          start();
        };

        if (motion.addEventListener) {
          motion.addEventListener("change", motionChange);
        } else {
          motion.addListener(motionChange);
        }

        addEventListener("pagehide", event => {
          stop();
          if (!event.persisted) dead = true;
        });

        addEventListener("pageshow", event => {
          if (event.persisted) {
            resize();
            start();
          }
        });

        resize();
        ready = true;
        root.dataset.renderer = "procedural-canvas2d";
        root.classList.add("earth-ready");
        start();
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run, {
          once: true
        });
      } else {
        run();
      }
    })();
  </script>
</body>
</html>
