<body>
  <div id="earth-background" aria-hidden="true">
    <canvas id="xaerova-earth"></canvas>
  </div>
  <main class="hero">
    <h1>SKYMIND DOCK</h1>
    <p class="coming-soon">COMING SOON</p>
    <p class="availability">24/7</p>
  </main>
  <script>
/* Procedural orbital scene: visible Earth motion, drifting clouds, and softly shining city lights. No assets or libraries. */
(() => {
  'use strict';
  const run = () => {
    const root = document.getElementById('earth-background');
    const canvas = document.getElementById('xaerova-earth');
    if (!root || !canvas) return;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) return;
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const TAU = Math.PI * 2, MW = 2048, MH = 1024, NW = 512, NH = 256;
    const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
    const fract = v => v - Math.floor(v);
    const ease = (a, b, v) => { v = clamp((v - a) / (b - a)); return v * v * (3 - 2 * v); };
    let seed = 71927;
    const random = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    const make = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const grid = (w, h) => {
      const values = new Float32Array(w * h);
      for (let i = 0; i < values.length; i++) values[i] = random();
      return (u, v) => {
        const x = fract(u) * w, y = fract(v) * h, xi = Math.floor(x), yi = Math.floor(y);
        const fx = x - xi, fy = y - yi, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
        const a = values[yi * w + xi], b = values[yi * w + (xi + 1) % w];
        const c = values[((yi + 1) % h) * w + xi], d = values[((yi + 1) % h) * w + (xi + 1) % w];
        return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy;
      };
    };
    const continents = [grid(4, 3), grid(9, 7), grid(23, 17)];
    const weather = [grid(5, 9), grid(13, 21), grid(29, 43), grid(61, 83), grid(127, 137)];
    const terrain = new Uint8Array(NW * NH), clouds = new Uint8Array(NW * NH);
    for (let y = 0; y < NH; y++) {
      const v = y / NH;
      for (let x = 0; x < NW; x++) {
        const u = x / NW, i = y * NW + x;
        const n = continents[0](u, v) * .60 + continents[1](u, v) * .28 + continents[2](u, v) * .12;
        terrain[i] = ease(.39, .61, n) * 255;
        const bend = weather[0](u, v);
        const w = weather[0](u, v) * .32 + weather[1](u + bend * .09, v) * .30 +
          weather[2](u + bend * .06, v) * .21 + weather[3](u, v) * .12 + weather[4](u, v) * .05;
        clouds[i] = Math.pow(ease(.39, .68, w), 1.15) * 255;
      }
    }
    const landAt = (x, y) => terrain[((Math.floor(y / MH * NH) + NH) % NH) * NW + ((Math.floor(x / MW * NW) + NW) % NW)] / 255;
    const city = make(MW, MH), cityCtx = city.getContext('2d', { willReadFrequently: true });
    cityCtx.fillStyle = '#000'; cityCtx.fillRect(0, 0, MW, MH);
    const hubs = [];
    for (let attempts = 0; attempts < 18000 && hubs.length < 1100; attempts++) {
      const x = random() * MW, y = random() * MH;
      if (landAt(x, y) < .56 || continents[1](x / MW, y / MH) < .43 || random() > .40 + .45 * continents[1](x / MW, y / MH)) continue;
      const radius = 2.5 + Math.pow(random(), 2) * 14;
      hubs.push({ x, y, radius });
      const branches = 4 + Math.floor(random() * 8);
      for (let branch = 0; branch < branches; branch++) {
        let angle = random() * TAU, px = x, py = y;
        const steps = 5 + Math.floor(random() * 25);
        for (let step = 0; step < steps; step++) {
          const distance = .55 + random() * radius * .20;
          angle += (random() - .5) * .55;
          const nx = px + Math.cos(angle) * distance, ny = py + Math.sin(angle) * distance;
          if (landAt(nx, ny) < .29) break;
          cityCtx.strokeStyle = 'rgba(255,255,255,' + (.003 + random() * .018) + ')';
          cityCtx.lineWidth = .35 + random() * .4;
          cityCtx.beginPath(); cityCtx.moveTo(px, py); cityCtx.lineTo(nx, ny); cityCtx.stroke();
          if (random() > .30) {
            const alpha = .15 + Math.pow(random(), 2) * .83;
            cityCtx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
            const dot = .28 + random() * .52;
            cityCtx.fillRect(nx, ny, dot, dot);
            if (random() > .62) {
              cityCtx.fillStyle = 'rgba(255,255,255,' + alpha * .52 + ')';
              cityCtx.fillRect(nx + (random() - .5) * 3, ny + (random() - .5) * 3, .6, .6);
            }
          }
          px = nx; py = ny;
        }
      }
      for (let k = 0; k < 35; k++) {
        const angle = random() * TAU, r = Math.pow(random(), 1.8) * radius;
        cityCtx.fillStyle = 'rgba(255,255,255,' + (.18 + random() * .74) + ')';
        cityCtx.fillRect(x + Math.cos(angle) * r, y + Math.sin(angle) * r * .65, .4 + random() * .7, .4 + random() * .6);
      }
    }
    // Nearby settlements connect with faint, imperfect routes instead of a regular grid.
    cityCtx.lineWidth = .45;
    for (let i = 0; i < hubs.length; i++) {
      const a = hubs[i]; let nearest = null, distance = 58 * 58;
      for (let j = i + 1; j < Math.min(hubs.length, i + 90); j++) {
        const b = hubs[j], d = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (d < distance && d > 9 * 9 && landAt((a.x + b.x) / 2, (a.y + b.y) / 2) > .35) { nearest = b; distance = d; }
      }
      if (!nearest) continue;
      cityCtx.strokeStyle = 'rgba(255,255,255,.018)';
      cityCtx.beginPath(); cityCtx.moveTo(a.x, a.y);
      cityCtx.quadraticCurveTo((a.x + nearest.x) / 2 + 5, (a.y + nearest.y) / 2 - 4, nearest.x, nearest.y); cityCtx.stroke();
    }
    const glow = make(MW, MH), glowCtx = glow.getContext('2d', { willReadFrequently: true });
    glowCtx.fillStyle = '#000'; glowCtx.fillRect(0, 0, MW, MH);
    glowCtx.filter = 'blur(2.2px)'; glowCtx.drawImage(city, 0, 0); glowCtx.filter = 'none';
    const cityPixels = cityCtx.getImageData(0, 0, MW, MH).data, glowPixels = glowCtx.getImageData(0, 0, MW, MH).data;
    const lights = new Uint8Array(MW * MH), bloom = new Uint8Array(MW * MH);
    for (let i = 0; i < lights.length; i++) { lights[i] = cityPixels[i * 4]; bloom[i] = glowPixels[i * 4]; }
    const sky = make(1, 1), skyCtx = sky.getContext('2d');
    const atmosphere = make(1, 1), atmosphereCtx = atmosphere.getContext('2d');
    const surface = make(1, 1), surfaceCtx = surface.getContext('2d');
    const cityPulseX = new Float32Array(MW), cityPulseY = new Float32Array(MH);
    const starSprite = make(32, 32), starCtx = starSprite.getContext('2d');
    const starLight = starCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    starLight.addColorStop(0, 'rgba(228,251,255,1)');
    starLight.addColorStop(.12, 'rgba(177,230,255,.85)');
    starLight.addColorStop(.32, 'rgba(113,199,245,.18)');
    starLight.addColorStop(1, 'rgba(74,176,238,0)');
    starCtx.fillStyle = starLight; starCtx.fillRect(0, 0, 32, 32);
    let shiningStars = [];
    let width, height, top, pixels, map, count = 0, horizon = [], raf = 0, last = 0, elapsed = 0, frames = 0, dead = false;
    let resizeFrame = 0, ready = false;

    function rim(context, strength) {
      const scale = width / 1365;
      const gradient = context.createLinearGradient(0, 0, width, 0);
      gradient.addColorStop(0, 'rgba(8,143,181,' + strength * .32 + ')');
      gradient.addColorStop(.25, 'rgba(61,201,248,' + strength * .69 + ')');
      gradient.addColorStop(.60, 'rgba(203,255,255,' + strength + ')');
      gradient.addColorStop(.83, 'rgba(135,242,255,' + strength * .92 + ')');
      gradient.addColorStop(1, 'rgba(62,209,237,' + strength * .64 + ')');
      context.strokeStyle = gradient;
      for (const layer of [[76, 25, .28], [30, 12, .60], [12, 4, .86], [5.2, 1.0, 1]]) {
        context.globalAlpha = layer[2]; context.lineWidth = Math.max(1, layer[0] * scale);
        context.filter = 'blur(' + Math.max(.3, layer[1] * scale) + 'px)';
        context.beginPath();
        for (let i = 0; i < horizon.length; i++) {
          const p = horizon[i]; if (!i) context.moveTo(p[0], p[1]); else context.lineTo(p[0], p[1]);
        }
        context.stroke();
      }
      context.filter = 'none'; context.globalAlpha = 1;
    }

    function resize() {
      if (dead) return;
      const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
      const ratio = Math.min(devicePixelRatio || 1, 1.15, (w <= 760 ? 550 : 900) / w);
      width = canvas.width = sky.width = atmosphere.width = Math.round(w * ratio);
      height = canvas.height = sky.height = atmosphere.height = Math.round(h * ratio);
      const camera = 1.035, pitch = .29, cp = Math.cos(pitch), sp = Math.sin(pitch);
      const tanH = Math.tan(Math.PI * 70 / 360), tanV = tanH * height / width;
      const q = Math.sqrt(camera * camera - 1) / camera;
      horizon = [];
      for (let x = 0; x <= width + 8; x += 8) {
        const sx = (x / width - .5) * 2 * tanH;
        const A = cp * cp - q * q, B = -2 * sp * cp, C = sp * sp - q * q * (1 + sx * sx);
        const sy = (-B - Math.sqrt(B * B - 4 * A * C)) / (2 * A);
        horizon.push([x, (.5 - sy / (2 * tanV)) * height]);
      }
      top = Math.max(0, Math.floor(Math.min(...horizon.map(p => p[1]))) - 2);
      surface.width = width; surface.height = height - top;
      pixels = surfaceCtx.createImageData(width, height - top);
      const capacity = width * (height - top);
      map = {
        index: new Uint32Array(capacity),
        u: new Float32Array(capacity),
        cityRow: new Uint32Array(capacity),
        smallRow: new Uint32Array(capacity),
        cityFy: new Float32Array(capacity),
        smallFy: new Float32Array(capacity),
        fog: new Float32Array(capacity),
        shade: new Float32Array(capacity)
      };
      count = 0;
      for (let y = top; y < height; y++) {
        const sy = (.5 - (y + .5) / height) * 2 * tanV;
        for (let x = 0; x < width; x++) {
          const sx = ((x + .5) / width - .5) * 2 * tanH;
          const length = Math.sqrt(1 + sx * sx + sy * sy);
          const dx = sx / length, dy = (cp + sy * sp) / length, dz = (-sp + sy * cp) / length;
          const b = camera * dz, discriminant = b * b - (camera * camera - 1);
          if (discriminant <= 0 || dz >= 0) continue;
          const distance = -b - Math.sqrt(discriminant);
          const px = distance * dx, py = distance * dy, pz = camera + distance * dz;
          const north = .9 * py - .435889894 * pz, depth = .435889894 * py + .9 * pz;
          const incidence = -(px * dx + py * dy + pz * dz), i = count++;
          const offset = ((y - top) * width + x) * 4;
          map.index[i] = offset;
          map.u[i] = fract(.52 + Math.atan2(px, depth) / TAU * 14) * MW;
          const v = fract(.15 + (.5 - Math.asin(clamp(north, -1, 1)) / Math.PI) * 6);
          const cityY = v * MH, smallY = v * NH;
          map.cityRow[i] = (cityY | 0) * MW;
          map.cityFy[i] = cityY - (cityY | 0);
          map.smallRow[i] = (smallY | 0) * NW;
          map.smallFy[i] = smallY - (smallY | 0);
          map.fog[i] = Math.exp(-incidence * 23);
          map.shade[i] = .70 + .30 * clamp((y - top) / (height - top));
          pixels.data[offset + 3] = 255;
        }
      }
      skyCtx.fillStyle = '#01050a';
      skyCtx.fillRect(0, 0, width, height);
      skyCtx.save();
      skyCtx.scale(1, .85);
      const skyGlow = skyCtx.createRadialGradient(
        width * .64, height * .46 / .85, 0,
        width * .64, height * .46 / .85, width * .78
      );
      skyGlow.addColorStop(0, 'rgba(0,174,193,.32)');
      skyGlow.addColorStop(.35, 'rgba(0,96,122,.17)');
      skyGlow.addColorStop(1, 'rgba(0,18,33,0)');
      skyCtx.fillStyle = skyGlow;
      skyCtx.fillRect(0, 0, width, height / .85);
      skyCtx.restore();

      shiningStars = [];
      let starSeed = 1781;
      const starRandom = () => {
        starSeed = starSeed * 16807 % 2147483647;
        return (starSeed - 1) / 2147483646;
      };
      for (let i = 0; i < Math.min(230, width * height / 5100); i++) {
        const x = starRandom() * width;
        const y = starRandom() * height * .60;
        const r = .25 + starRandom() * .65;
        skyCtx.fillStyle = 'rgba(153,213,228,' + (.12 + starRandom() * .44) + ')';
        skyCtx.beginPath();
        skyCtx.arc(x, y, r, 0, TAU);
        skyCtx.fill();

        if (i % 9 === 2 && y < height * .44) {
          shiningStars.push({
            x, y,
            size: 5 + r * 5,
            phase: i * 1.71,
            speed: .68 + (i % 5) * .11
          });
        }
      }
      rim(atmosphereCtx, .86);
      render();
    }

    function render() {
      if (!pixels || dead) return;
      const output = pixels.data;
      const orbit = fract(elapsed * .00165) * MW;
      const wind = fract(.12 + elapsed * .00065) * NW;

      // Nearby lights brighten together; distant city clusters use different phases.
      const lightPhase = elapsed * 1.02;
      for (let x = 0; x < MW; x++) {
        cityPulseX[x] = .5 + .5 * Math.sin(lightPhase + x * .061);
      }
      for (let y = 0; y < MH; y++) {
        cityPulseY[y] = .5 + .5 * Math.sin(elapsed * .74 + y * .077 + 2.3);
      }

      for (let i = 0; i < count; i++) {
        const x = map.u[i] + orbit;
        const floorX = x | 0;
        const fx = x - floorX;
        const x0 = floorX & (MW - 1);
        const x1 = (x0 + 1) & (MW - 1);
        const row = map.cityRow[i];
        const next = (row + MW) & (MW * MH - 1);
        const fy = map.cityFy[i];
        const a = row + x0;
        const b = row + x1;
        const c = next + x0;
        const d = next + x1;
        const wa = (1 - fx) * (1 - fy);
        const wb = fx * (1 - fy);
        const wc = (1 - fx) * fy;
        const wd = fx * fy;

        const lightValue = lights[a] * wa + lights[b] * wb + lights[c] * wc + lights[d] * wd;
        const glowValue = bloom[a] * wa + bloom[b] * wb + bloom[c] * wc + bloom[d] * wd;

        const smallX = x * .25;
        const floorSmall = smallX | 0;
        const f = smallX - floorSmall;
        const sx = floorSmall & (NW - 1);
        const sx1 = (sx + 1) & (NW - 1);
        const sr = map.smallRow[i];
        const sn = (sr + NW) & (NW * NH - 1);
        const sf = map.smallFy[i];

        const land = (
          (terrain[sr + sx] * (1 - f) + terrain[sr + sx1] * f) * (1 - sf) +
          (terrain[sn + sx] * (1 - f) + terrain[sn + sx1] * f) * sf
        ) / 255;

        const cloudX = smallX + wind;
        const floorCloud = cloudX | 0;
        const cf = cloudX - floorCloud;
        const cx = floorCloud & (NW - 1);
        const cx1 = (cx + 1) & (NW - 1);

        const cover = (
          (clouds[sr + cx] * (1 - cf) + clouds[sr + cx1] * cf) * (1 - sf) +
          (clouds[sn + cx] * (1 - cf) + clouds[sn + cx1] * cf) * sf
        ) / 255;

        const target = map.index[i];
        const fog = map.fog[i];
        const transmission = 1 - cover * .93;

        const shine =
          .57 +
          cityPulseX[x0] ** 2 * .66 +
          cityPulseY[row / MW] ** 2 * .37;

        const city = lightValue * transmission * (1 - fog * .94) * .93 * shine;
        const glow = glowValue * transmission * .95 * (1 - fog * .8) * (.72 + shine * .43);
        const white = Math.max(0, city - 36) * .42;
        const cloudLight = cover * (47 + fog * 25);
        const shade = map.shade[i] * .60;

        output[target] =
          (2 + land * 3) * shade +
          city * 1.12 +
          glow * .80 +
          cloudLight * .66 +
          fog * 1.8;

        output[target + 1] =
          (7 + land * 5) * shade +
          city * .87 +
          glow * .57 +
          white +
          cloudLight * .82 +
          fog * 15;

        output[target + 2] =
          (13 + land * 6) * shade +
          city * .66 +
          glow * .43 +
          white +
          cloudLight +
          fog * 26;
      }

      surfaceCtx.putImageData(pixels, 0, 0);
      ctx.drawImage(sky, 0, 0);

      for (const star of shiningStars) {
        ctx.globalAlpha = .20 + .36 * (
          .5 + .5 * Math.sin(elapsed * star.speed + star.phase)
        );
        ctx.drawImage(
          starSprite,
          star.x - star.size / 2,
          star.y - star.size / 2,
          star.size,
          star.size
        );
      }

      ctx.globalAlpha = 1;
      ctx.drawImage(surface, 0, top);

      // Keep the atmospheric rim calm while individual lights pulse.
      ctx.globalAlpha = .84 + Math.sin(elapsed * .95) * .018;
      ctx.drawImage(atmosphere, 0, 0);
      ctx.globalAlpha = 1;

      frames++;
      root.dataset.proceduralFrame = String(frames);
      root.dataset.proceduralTime = elapsed.toFixed(2);
      root.dataset.proceduralOrbit = (orbit / MW).toFixed(5);
      root.dataset.proceduralLightPhase = (lightPhase % TAU).toFixed(3);
    }

    function stop() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      last = 0;
    }

    function start() {
      if (!dead && ready && !raf && !document.hidden && !motion.matches) {
        raf = requestAnimationFrame(tick);
      }
    }

    function tick(now) {
      raf = 0;
      if (dead || document.hidden || motion.matches) {
        last = 0;
        return;
      }
      if (!last) last = now;
      const delta = now - last;
      const interval = innerWidth <= 760 ? 1000 / 16 : 1000 / 20;
      if (delta >= interval) {
        elapsed += Math.min(delta / 1000, .25);
        last = now;
        render();
      }
      start();
    }

    addEventListener('resize', () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(resize);
    }, { passive: true });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stop();
      else start();
    });

    const motionChange = () => {
      stop();
      render();
      start();
    };

    if (motion.addEventListener) {
      motion.addEventListener('change', motionChange);
    } else {
      motion.addListener(motionChange);
    }

    addEventListener('pagehide', event => {
      stop();
      if (!event.persisted) dead = true;
    });

    addEventListener('pageshow', event => {
      if (event.persisted) {
        resize();
        start();
      }
    });

    resize();
    ready = true;
    root.dataset.renderer = 'procedural-canvas2d';
    root.classList.add('earth-ready');
    start();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run, { once: true });
  } else {
    run();
  }
})();
  </script>
</body>
</html>
